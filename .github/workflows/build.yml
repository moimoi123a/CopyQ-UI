name: Build CopyQ-UI (Ubuntu 24.04 / Linux Mint 22.x)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Khớp đúng nền Ubuntu 24.04 (noble) của Linux Mint 22.x
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install GTK4 development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev pkg-config

      - name: Check Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Run unit tests
        run: cargo test --verbose

      - name: Build release binary
        run: cargo build --release

      - name: Prepare release package
        run: |
          mkdir -p dist
          cp target/release/copyq-ui dist/copyq-ui
          cp assets/style.css dist/style.css
          (cd dist && sha256sum copyq-ui style.css > SHA256SUMS.txt)
          ls -lh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: copyq-ui-linux-x86_64
          path: dist/
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: copyq-ui-linux-x86_64
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/copyq-ui \
            dist/style.css \
            dist/SHA256SUMS.txt \
            --title "CopyQ-UI ${GITHUB_REF_NAME}" \
            --generate-notes
